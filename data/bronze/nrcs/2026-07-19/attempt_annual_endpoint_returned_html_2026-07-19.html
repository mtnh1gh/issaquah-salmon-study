<!doctype HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <meta http-equiv="Content-Language" content="en-us">
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
        <title>NRCS National Water and Climate Center - FTP Server Help</title>
        <script type="module" crossorigin src="/assets/wcis-legacy-style-ths5wwL9.js"></script>
        <link rel="stylesheet" crossorigin href="/assets/css/wcis-legacy-style.B6VE1Pbz.css">
    </head>
    <body>
        <nwcc-header>
            <abbr slot="app-acronym">Reports</abbr>
            <abbr slot="application-long-name">Air & Water Database Reports</abbr>
            <span slot="splash-short-title">Reports</span>
            <span slot="splash-long-title">Air & Water Database Reports</span>
        </nwcc-header>
        <main id="main-content" tabindex="-1">
            <div class="wcis" style="margin: 1em">
                <table
                    width="671"
                    height="400"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                >
                    <tr valign="top">
                        <td width="8">&nbsp;&nbsp;</td>
                        <td width="642">
                            <h2>
                                <br>
                                Server Unavailable
                            </h2>
                            <p class="note">The server is currently unavailable, please try again at a later time.</p>
                        </td>
                    </tr>
                </table>
            </div>
        </main>
        <nwcc-footer/>
        <script>
			function loadMain () {
				const main = document.getElementById('main-content');
				main.style.visibility = 'visible'
				const shadowDom = document.getElementsByTagName('nwcc-header')[0].shadowRoot
				const splash = shadowDom.getElementById('loading-splash')
				splash.style.display = 'none'
				const wcisDiv = document.getElementsByClassName('wcis')[0];
				wcisDiv.style.visibility = 'visible'		
			}

			window.onload = function () {
				loadMain();
			}
        </script>
    </body>
</html>
